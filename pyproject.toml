[project]
name = "metis"
version = "0.1.0"
description = "Catalogue and visualize a codebase as a clickable compendium"
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    # 0.26.0 segfaults when Python objects are allocated while iterating query results
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-language-pack>=0.9",
    "markdown-it-py>=3.0",
    "pyyaml>=6.0",
    "claude-agent-sdk>=0.1",
    "pygments>=2.21.0",
]

[project.scripts]
metis = "metis.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",
    "mypy>=1.10",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metis"]

[tool.ruff]
line-length = 100
extend-exclude = ["tests/fixtures"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", ".venv"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
